<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100">
  <!-- Icon mark (scaled 100x100 within a 420x100 canvas) -->
  <g transform="translate(0,0) scale(0.5)">
    <rect width="200" height="200" rx="44" fill="#e8390e"/>
    <line x1="74" y1="52" x2="100" y2="26" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.70"/>
    <line x1="100" y1="26" x2="126" y2="52" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.70"/>
    <line x1="74"  y1="52" x2="126" y2="52" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="26" r="7" fill="white" opacity="0.82"/>
    <circle cx="74"  cy="52" r="9" fill="white"/>
    <circle cx="100" cy="52" r="9" fill="white"/>
    <circle cx="126" cy="52" r="9" fill="white"/>
    <rect x="69"  y="52" width="10" height="50" rx="5" fill="white"/>
    <rect x="95"  y="52" width="10" height="50" rx="5" fill="white"/>
    <rect x="121" y="52" width="10" height="50" rx="5" fill="white"/>
    <rect x="69" y="99" width="62" height="10" rx="5" fill="white"/>
    <rect x="95" y="107" width="10" height="66" rx="5" fill="white"/>
  </g>

  <!-- "Nosh" in brand orange-red -->
  <text x="115" y="67" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#e8390e" letter-spacing="-1">Nosh</text>
  <!-- "Mesh" in dark charcoal -->
  <text x="227" y="67" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1a1a1a" letter-spacing="-1">Mesh</text>
</svg>
